# GitHub Pages builds this site with Jekyll. There is no .nojekyll file, so it
# was already running before this config existed — it just had nothing to do.
#
# Existing .html files have no YAML front matter, so Jekyll copies them through
# byte-for-byte and does NOT process Liquid in them. index.html and
# audio-face-animator/index.html are unaffected by anything here.

title: DevEloop
description: Unity tools and motion-capture animation packs for the Unity Asset Store.
url: https://dev-eloop.github.io

# Pages become /path/name/ rather than /path/name.html
permalink: pretty

# Lets a page declare `redirect_to:` in its front matter. Ships inside the
# github-pages gem, so there is nothing extra to install. Used by
# audio-face-animator/docs/character-setup.md, whose URL was published before the
# documentation was consolidated onto one page.
plugins:
  - jekyll-redirect-from
  - jekyll-sitemap

# Never publish local-only files, even if one is committed by accident.
exclude:
  - .claude
  - how_to_set_ssh_key.txt
  - how_to_run_locally.txt
  - README.md
  - Gemfile
